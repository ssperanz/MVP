name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:

  warehouse:
    name: Warehouse tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: microservices/warehouse/package-lock.json

      - name: Start test infrastructure
        run: docker compose up -d mongodb

      - name: Install dependencies
        working-directory: microservices/warehouse
        run: npm ci

      - name: Run tests
        working-directory: microservices/warehouse
        run: npm run test:cov

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: microservices/warehouse/coverage/lcov.info
          flags: warehouse
          name: warehouse
          disable_search: true
          fail_ci_if_error: true

  warehouse-aggregator:
    name: Warehouse Aggregator tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
