        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: microservices/centralized/state_aggregate/coverage/lcov.info
          flags: CloudState
          name: Cloud State
          disable_search: true
          fail_ci_if_error: true

  system-tests:
    name: System tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: microservices/test/package-lock.json

      - name: Start services with Docker Compose
        run: |
          docker compose up -d

      - name: Show running containers
        run: docker compose ps

      - name: Wait for services
        run: |
          echo "Waiting for services..."
          sleep 10

      - name: Install system test dependencies
        working-directory: microservices/test/system
        run: npm ci

      - name: Run system tests
        working-directory: microservices/test/system
        run: npm run test

      - name: Show Docker logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop services
        if: always()
        run: docker compose down -v