services:
  #==========================================================================#
  #                         Warehouse Microservices                          #
  #==========================================================================#
  warehouse-1:
    build:
      context: ./microservices/warehouse
      dockerfile: Dockerfile
    container_name: warehouse-1
    environment:
      - MONGO_URI=mongodb://mongo:27017/warehouse-1
      - WAREHOUSE_ID=1
      - NATS_URL=nats://nats:4222
    volumes:
      - ./microservices/warehouse/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - mongodb
      - nats
      - resgate

  warehouse-2:
    build:
      context: ./microservices/warehouse
      dockerfile: Dockerfile
    container_name: warehouse-2
    environment:
      - MONGO_URI=mongodb://mongo:27017/warehouse-2
      - WAREHOUSE_ID=2
      - NATS_URL=nats://nats:4222
    volumes:
      - ./microservices/warehouse/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - mongodb
      - nats
      - resgate


  #==========================================================================#
  #                         Cloud Microservices                              #
  #==========================================================================#

  warehouse-aggregator:
    build:
      context: ./microservices/warehouse-aggregator
      dockerfile: Dockerfile
    container_name: warehouse-aggregator
    ports:
      - "3110:3110"
    environment:
      - MONGO_URI=mongodb://mongo:27017/warehouse-aggregator
      - NATS_URL=nats://nats:4222
      - PORT=3110
    volumes:
      - ./microservices/warehouse-aggregator/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - mongodb
      - nats
      - resgate


  #==========================================================================#
  #                 Centralized System Microservices                         #
  #==========================================================================#

  authentication:
    container_name: authentication
    build:
      context: ./microservices/centralized/authentication
      dockerfile: Dockerfile
    ports:
      - "3510:3510"
    environment:
      - PORT=3510
      - MONGO_DB=mongodb://mongo:27017/authentication
      - JWT_SECRET=IREALLYLOVEM31!!!!!!!!!!!!!!!!!!
    volumes:
      - ./microservices/centralized/authentication/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - nats
      - mongodb
      - resgate

  routing:
    build:
      context: ./microservices/centralized/routing
      dockerfile: Dockerfile
    environment:
      - MONGO_DB=mongodb://mongo:27017/routing
    volumes:
      - ./microservices/centralized/routing/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - nats
      - mongodb
      - resgate
  state_aggregate:
    build:
      context: ./microservices/centralized/state_aggregate
      dockerfile: Dockerfile
    environment:
      - MONGO_DB=mongodb://mongo:27017/state_aggregate
      - WAREHOUSE_ID=1
    volumes:
      - ./microservices/centralized/state_aggregate/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - nats
      - mongodb
      - resgate

  centralsystem:
    container_name: CentralSystem
    build:
      context: ./microservices/centralized/CentralSystem
      dockerfile: Dockerfile
    environment:
      - MONGO_DB=mongodb://mongo:27017/centralsystem
    volumes:
      - ./microservices/centralized/CentralSystem/src:/usr/src/app/src:Z
    networks:
      - shared-warehouses
    depends_on:
      - nats
      - mongodb
      - resgate

  #==========================================================================#
  #                         Infrastructure Microservices                     #
  #==========================================================================#

  resgate:
    image: resgateio/resgate
    container_name: resgate
    ports:
      - "8080:8080"
    depends_on:
      - nats
    #volumes:
    #  - ./microservizi/resgate/resgate-config.json:/app/config.json
    command:
      - "-n"
      - "nats://nats:4222"
      - "-DV"
      - "--headauth"
      - "auth.jwtHeader"
    networks:
      - shared-warehouses
    platform: linux/amd64

  mongodb:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    networks:
      - shared-warehouses
    #volumes:
    #  - ./microservizi/mongo_db:/docker-entrypoint-initdb.d

  nats:
    container_name: nats
    image: nats:latest
    ports:
      - "4222:4222"
    command:
      - "--jetstream"
      - "--debug"
      - "--trace"
    networks:
      - shared-warehouses

  #==========================================================================#
  #                         Infrastructure Telemetry                         #
  #==========================================================================#

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./microservices/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - shared-warehouses
    restart: unless-stopped
    depends_on:
      - warehouse-aggregator

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3210:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./microservices/grafana/provisioning:/etc/grafana/provisioning
      - ./microservices/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - shared-warehouses
    depends_on:
      - prometheus
      - warehouse-aggregator

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  shared-warehouses:
    driver: bridge
